[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freshkarti-piiscrub"
version = "0.1.0"
description = "按类别识别邮箱、电话、身份证、密钥等模式并定位，统计残留率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "freshkarti" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://freshkarti.github.io"
Repository = "https://github.com/freshkarti/piiscrub"
Issues = "https://github.com/freshkarti/piiscrub/issues"

[project.scripts]
piiscrub = "piiscrub:main"

[tool.setuptools]
py-modules = ["piiscrub"]
